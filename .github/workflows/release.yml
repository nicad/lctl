name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match Cargo.toml, without v prefix)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Tag, GitHub Release, update tap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION (expected semver like 0.1.0)"
            exit 1
          fi
          CARGO_VERSION="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "Cargo.toml version ($CARGO_VERSION) does not match input ($VERSION)."
            echo "Bump Cargo.toml on main first, then re-run this workflow."
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Compute tarball sha256
        id: sha
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL -o /tmp/angel-src.tar.gz "$URL"
          SHA256="$(shasum -a 256 /tmp/angel-src.tar.gz | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          URL: ${{ steps.sha.outputs.url }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN secret is missing."
            echo "Create a PAT with repo access to oliviaBahr/homebrew-tap and add it as a repo secret."
            exit 1
          fi

          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/oliviaBahr/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"

          FORMULA="$TAP_DIR/Formula/angel.rb"
          {
            echo 'class Angel < Formula'
            echo '  desc "The launchctl macOS users deserve"'
            echo '  homepage "https://github.com/oliviaBahr/angel"'
            echo "  url \"${URL}\""
            echo "  sha256 \"${SHA256}\""
            echo '  license "MIT"'
            echo
            echo '  depends_on :macos'
            echo '  depends_on "rust" => :build'
            echo
            echo '  def install'
            echo '    system "cargo", "install", *std_cargo_args'
            echo '    man1.install "man/angel.1"'
            echo '  end'
            echo
            echo '  test do'
            echo '    assert_match version.to_s, shell_output("#{bin}/angel --version")'
            echo '  end'
            echo 'end'
          } > "$FORMULA"

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/angel.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "angel ${TAG}"
          git push origin HEAD:main
