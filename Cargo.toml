[package]
    name        = "angel"
    version     = "0.1.0"
    edition     = "2024"
    default-run = "angel"
    description = "The launchctl MacOS users deserve"
    keywords    = ["macos", "launchctl"]
    categories  = ["command-line-utilities", "os"]

    [package.metadata.docs.rs]
        targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
    clap        = { version = "4", features = ["derive"] }
    serde       = { version = "1", features = ["derive"] }
    serde_yaml  = "0.9"
    plist       = "1"
    error_set   = "0.9"
    dirs        = "6"
    nix         = { version = "0.30", features = ["fs", "user"] }
    crossterm   = "0.29"
    comfy-table = "7"
    dialoguer   = "0.12"
    nom         = "8.0.0"
    rev_lines   = "0.3"

[dev-dependencies]
    assert_cmd  = "2"
    predicates  = "3"
    tempfile    = "3"

[[test]]
    name = "e2e"
    path = "tests/e2e/main.rs"

[[test]]
    name = "unit"
    path = "tests/unit/main.rs"
