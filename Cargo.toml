[package]
    name        = "angel"
    version     = "0.1.0"
    edition     = "2024"
    default-run = "angel"

[dependencies]
    clap        = { version = "4", features = ["derive"] }
    serde       = { version = "1", features = ["derive"] }
    serde_yaml  = "0.9"
    plist       = "1"
    error_set   = "0.9"
    dirs        = "6"
    nix         = { version = "0.30", features = ["fs", "user"] }
    crossterm   = "0.29"
    comfy-table = "7"
    dialoguer   = "0.12"
    nom         = "8.0.0"
    rev_lines   = "0.3"
